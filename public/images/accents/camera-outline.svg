<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="160" viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Same golden gradient as the logo -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>
  </defs>
  
  <!-- Camera body with curved edges -->
  <rect x="30" y="40" width="180" height="100" rx="20" ry="20" 
        stroke="url(#goldGradient)" stroke-width="3" fill="none" />
  
  <!-- Camera lens - circular center element -->
  <circle cx="120" cy="90" r="35" 
          stroke="url(#goldGradient)" stroke-width="3" fill="none" />
  
  <!-- Viewfinder - small rectangular element on top -->
  <rect x="95" y="20" width="50" height="20" rx="5" ry="5" 
        stroke="url(#goldGradient)" stroke-width="3" fill="none" />
  
  <!-- Flash - small rounded rectangle on top right -->
  <rect x="155" y="30" width="20" height="10" rx="5" ry="5" 
        stroke="url(#goldGradient)" stroke-width="2" fill="none" />
  
  <!-- Camera button - small circle on top right -->
  <circle cx="185" cy="60" r="8" 
          stroke="url(#goldGradient)" stroke-width="2" fill="none" />
  
  <!-- Small decorative swirl element matching the logo style -->
  <path d="M60 60C60 50 45 45 65 45C85 45 70 50 70 60C70 70 85 75 65 75C45 75 60 70 60 60Z" 
        stroke="url(#goldGradient)" stroke-width="2" fill="none" />
</svg> 