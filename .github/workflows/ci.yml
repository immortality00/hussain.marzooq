name: CI

on:
  push:
    branches: [master, v2-portfolio]
  pull_request:

# The repository's default token can write; these jobs only read the code. The npm
# cache and the Playwright report upload use Actions' own runtime token, not this one.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        timeout-minutes: 10
        env:
          # Dummy values so modules that read env at import time don't throw during
          # the build (lib/mongodb.ts throws without MONGODB_URI). No real DB is
          # reached — the connection is refused and every public read is fail-safe
          # (L4), so pages prerender with empty data. Mirrors vitest.config.mts.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: hm_visuals_ci
          RESEND_API_KEY: ci_resend_key

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Playwright's own image already holds Chromium and the system libraries it
    # needs, so nothing comes from the Ubuntu package mirror (`--with-deps` timed
    # out on it three times). Its version must equal the lockfile's Playwright —
    # the step after npm ci checks it. On a Playwright upgrade, change the tag and
    # the digest together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001 --ipc=host
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The seed script refuses any database whose name is not an e2e/test one,
      # and playwright.config.ts forces the same name onto the server it starts.
      # Inside a container job the service is reached by its name.
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: hm_visuals_e2e
    steps:
      - uses: actions/checkout@v4

      # The image carries Node 24; the project pins 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - name: Check the Playwright image matches the lockfile
        timeout-minutes: 1
        run: |
          image=$(node -p "require('/ms-playwright-agent/node_modules/playwright-core/package.json').version")
          lockfile=$(node -p "require('./node_modules/playwright-core/package.json').version")
          if [ "$image" != "$lockfile" ]; then
            echo "::error::The Playwright image is $image but the lockfile has $lockfile. Change the container image tag and digest in ci.yml."
            exit 1
          fi
          echo "Playwright $image in the image and the lockfile."

      - run: npm run db:seed-e2e
        timeout-minutes: 2

      - run: npm run test:e2e
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
