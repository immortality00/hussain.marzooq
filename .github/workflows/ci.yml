name: CI

on:
  push:
    branches: [master, v2-portfolio]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No `next build` — the app is verified with typecheck + lint + tests only.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
