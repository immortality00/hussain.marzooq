name: CI

on:
  push:
    branches: [master, v2-portfolio]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        timeout-minutes: 10
        env:
          # Dummy values so modules that read env at import time don't throw during
          # the build (lib/mongodb.ts throws without MONGODB_URI). No real DB is
          # reached — the connection is refused and every public read is fail-safe
          # (L4), so pages prerender with empty data. Mirrors vitest.config.mts.
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: hm_visuals_ci
          RESEND_API_KEY: ci_resend_key

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The seed script refuses any database whose name is not an e2e/test one,
      # and playwright.config.ts forces the same name onto the server it starts.
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: hm_visuals_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - run: npm run db:seed-e2e
        timeout-minutes: 2

      - run: npm run test:e2e
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
